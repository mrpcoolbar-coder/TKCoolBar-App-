name: Build TK Cool Bar Safe SMS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract TK Cool Bar Project
        run: |
          mkdir build-project
          unzip -q TKCoolBar-Safe-SMS-Release-v2.zip -d build-project
          echo "Project extracted:"
          find build-project -maxdepth 3 -type f | head -50

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Enable AndroidX
        run: |
          cd build-project/TKCoolBarFinal
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build APK
        run: |
          cd build-project/TKCoolBarFinal
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Verify APK
        run: |
          APK=$(find build-project/TKCoolBarFinal/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK found: $APK"
          if unzip -p "$APK" AndroidManifest.xml | strings | grep -q "android.permission.SEND_SMS"; then
            echo "ERROR: SEND_SMS permission found!"
            exit 1
          fi
          echo "OK: SEND_SMS permission not found."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TKCoolBar-Safe-SMS-APK
          path: build-project/TKCoolBarFinal/app/build/outputs/apk/debug/*.apk
