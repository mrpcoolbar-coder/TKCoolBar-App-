name: Build TK Cool Bar Safe SMS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug
          else
            gradle clean assembleDebug
          fi

      - name: Verify APK permissions
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK: $APK"
          if unzip -p "$APK" AndroidManifest.xml | strings | grep -q "android.permission.SEND_SMS"; then
            echo "ERROR: SEND_SMS permission found!"
            exit 1
          fi
          echo "OK: SEND_SMS permission not found."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TKCoolBar-Safe-SMS-APK
          path: app/build/outputs/apk/debug/*.apk
